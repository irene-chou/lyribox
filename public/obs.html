<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyribox - OBS Display</title>
<script src="https://unpkg.com/piesocket-js@5.2.0/dist/piesocket.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>@import url("https://font.emtech.cc/css/GenSenRoundedTW");</style>
<style>
  :root {
    --accent: #7c6aef;
    --accent-glow: rgba(124, 106, 239, 0.3);
    --active-lyric: #ffffff;

    --passed-lyric: #5a5a70;
    --upcoming-lyric: #9090a8;
    --text-dim: #55556a;
    --text-secondary: #8888a0;
    --text-primary: #e8e8f0;
    --border: #2a2a3a;
    --font-main: 'Noto Sans TC', sans-serif;
    --font-lyrics: 'GenSenRoundedTW', 'Noto Sans TC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-main);
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .lyrics-scroll-container {
    width: 100vw;
    margin-top: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .lyrics-scroll-container::-webkit-scrollbar { width: 0; }

  .lyric-line {
    border-radius: 10px;
    font-family: var(--font-lyrics);
    font-size: 28px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text-dim);
    transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    display: none;
  }

  .lyric-line.visible {
    display: block;
  }

  .lyric-line.active {
    font-weight: 700;
  }

  .lyric-line.interlude {
    font-style: italic;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  /* URL param overrides (see parseObsParams below) */
  body.shadow .lyric-line,
  body.shadow .now-singing-title,
  body.shadow .now-singing-label {
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  body.no-anim .lyric-line {
    transition: none;
  }

  .lyric-sub {
    font-size: 0.6em;
    font-weight: 400;
    line-height: 1.4;
    opacity: 0.75;
    margin-top: 2px;
    white-space: pre-line;
  }

  .now-singing {
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 16px;
    font-family: var(--font-lyrics);
  }
  .now-singing-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 13px;
    color: #ffffff;
  }
  .now-singing-title {
    font-weight: 500;
    font-size: 18px;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .now-singing-next {
    display: none;
    font-weight: 400;
    font-size: 13px;
    color: #ffffff;
    opacity: 0.7;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .waiting {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: var(--text-dim);
    font-size: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<div class="now-singing" id="nowSinging">
  <span class="now-singing-label">Now singing</span>
  <span class="now-singing-title" id="nowSingingTitle"></span>
  <span class="now-singing-next" id="nowSingingNext"></span>
</div>
<div class="lyrics-scroll-container" id="lyricsContainer">
  <div class="waiting" id="waitingState">等待控制頁面連線...</div>
</div>

<script>
  let lyrics = [];
  let currentLineIndex = -1;
  let activeFontSize = 32;
  let otherFontSize = 28;
  let titleFontSize = 18;
  let showTitle = true;
  let lyricsGap = 16;
  let visibleBefore = 0;
  let visibleAfter = 1;
  let activeColor = '#ffffff';
  let otherColor = '#9090a8';
  let passedColor = '#5a5a70';
  let lyricsBgColor = 'transparent';
  let songTitle = '';
  let nextSongTitle = null;
  let syncChannel = null;
  let gotState = false;
  // After a (re)connect, retry the state request a couple of times if nothing
  // has arrived (covers a dropped first message). Bounded — no polling while idle.
  const INITIAL_RETRY_DELAYS_MS = [5000, 20000];
  let retryTimers = [];
  function scheduleInitialRetries() {
    retryTimers.forEach(clearTimeout);
    gotState = false;
    retryTimers = INITIAL_RETRY_DELAYS_MS.map((ms) => setTimeout(() => {
      if (!gotState) requestFullState();
    }, ms));
  }

  // ========== URL param overrides ==========
  // Inline copy of src/lib/obs-params.ts `parseObsParams` (this page cannot import
  // modules). Keep the two in sync. Values here win over synced settings so several
  // OBS sources on one session can look different.
  function parseObsParams(search) {
    const q = new URLSearchParams(search);
    const out = {};
    const flag = (v) => (v === '1' || v === 'true') ? true : (v === '0' || v === 'false') ? false : undefined;
    const int = (v, min, max) => {
      if (v === null || !/^\d+$/.test(v.trim())) return undefined;
      const n = Number(v);
      return n >= min && n <= max ? n : undefined;
    };
    const align = q.get('align');
    if (['left', 'center', 'right'].includes(align)) out.align = align;
    const shadow = flag(q.get('shadow')); if (shadow !== undefined) out.shadow = shadow;
    const anim = flag(q.get('anim')); if (anim !== undefined) out.anim = anim;
    const title = flag(q.get('title')); if (title !== undefined) out.title = title;
    const before = int(q.get('before'), 0, 50); if (before !== undefined) out.before = before;
    const after = int(q.get('after'), 0, 50); if (after !== undefined) out.after = after;
    const size = int(q.get('size'), 8, 300); if (size !== undefined) out.size = size;
    const otherSize = int(q.get('otherSize'), 8, 300); if (otherSize !== undefined) out.otherSize = otherSize;
    const bg = (q.get('bg') || '').trim();
    if (bg && bg.length <= 64 && /^(#[0-9a-f]{3,8}|[a-z]+|(?:rgba?|hsla?)\([\d.,%\s/]+\))$/i.test(bg)) out.bg = bg;
    return out;
  }

  const overrides = parseObsParams(window.location.search);

  // Single resolution step: URL override ?? value synced from the control page.
  // Every render/update path reads through this so overrides survive any sync message.
  function effective() {
    return {
      activeFontSize: overrides.size ?? activeFontSize,
      otherFontSize: overrides.otherSize ?? otherFontSize,
      visibleBefore: overrides.before ?? visibleBefore,
      visibleAfter: overrides.after ?? visibleAfter,
      showTitle: overrides.title ?? showTitle,
      lyricsBgColor: overrides.bg ?? lyricsBgColor,
    };
  }

  // Static overrides applied once
  if (overrides.align) document.getElementById('lyricsContainer').style.textAlign = overrides.align;
  if (overrides.shadow) document.body.classList.add('shadow');
  if (overrides.anim === false) document.body.classList.add('no-anim');

  function applyGap() {
    document.getElementById('lyricsContainer').style.gap = lyricsGap + 'px';
  }

  function applyColors() {
    const bg = effective().lyricsBgColor;
    document.body.style.background = bg === 'transparent' ? 'transparent' : bg;
  }

  function updateNowSinging() {
    const el = document.getElementById('nowSinging');
    const titleEl = document.getElementById('nowSingingTitle');
    const labelEl = document.querySelector('.now-singing-label');
    if (effective().showTitle && songTitle && lyrics.length > 0) {
      titleEl.textContent = songTitle;
      labelEl.style.fontSize = Math.round(titleFontSize * 0.72) + 'px';
      titleEl.style.fontSize = titleFontSize + 'px';
      const nextEl = document.getElementById('nowSingingNext');
      if (nextSongTitle) {
        nextEl.textContent = '\u4E0B\u4E00\u9996\uFF1A' + nextSongTitle;
        nextEl.style.fontSize = Math.round(titleFontSize * 0.72) + 'px';
        nextEl.style.display = 'block';
      } else {
        nextEl.style.display = 'none';
      }
      el.style.display = 'flex';
    } else {
      el.style.display = 'none';
    }
  }

  // Fallbacks used when a patch carries an empty/undefined value
  const SETTING_DEFAULTS = {
    activeFontSize: 32,
    otherFontSize: 28,
    titleFontSize: 18,
    showTitle: true,
    lyricsGap: 16,
    visibleBefore: 0,
    visibleAfter: 1,
    activeColor: '#ffffff',
    otherColor: '#9090a8',
    passedColor: '#5a5a70',
    lyricsBgColor: 'transparent',
  };

  /**
   * Apply a (partial) settings object. Only keys present in `patch` are
   * touched; each re-render step runs at most once per call.
   */
  function applySettings(patch, { render = true } = {}) {
    if (!patch || typeof patch !== 'object') return;
    const has = (k) => Object.prototype.hasOwnProperty.call(patch, k);
    const num = (k) => (typeof patch[k] === 'number' && !Number.isNaN(patch[k]) ? patch[k] : SETTING_DEFAULTS[k]);
    const str = (k) => (patch[k] ? patch[k] : SETTING_DEFAULTS[k]);
    let needLines = false, needTitle = false, needColors = false, needGap = false;

    if (has('activeFontSize')) { activeFontSize = num('activeFontSize'); needLines = true; }
    if (has('otherFontSize')) { otherFontSize = num('otherFontSize'); needLines = true; }
    if (has('visibleBefore')) { visibleBefore = num('visibleBefore'); needLines = true; }
    if (has('visibleAfter')) { visibleAfter = num('visibleAfter'); needLines = true; }
    if (has('activeColor')) { activeColor = str('activeColor'); needLines = true; }
    if (has('otherColor')) { otherColor = str('otherColor'); needLines = true; }
    if (has('passedColor')) { passedColor = str('passedColor'); needLines = true; }
    if (has('lyricsBgColor')) { lyricsBgColor = str('lyricsBgColor'); needColors = true; }
    if (has('titleFontSize')) { titleFontSize = num('titleFontSize'); needTitle = true; }
    if (has('showTitle')) { showTitle = patch.showTitle ?? SETTING_DEFAULTS.showTitle; needTitle = true; }
    if (has('lyricsGap')) { lyricsGap = num('lyricsGap'); needGap = true; }

    if (!render) return;
    if (needLines) updateActiveLine();
    if (needTitle) updateNowSinging();
    if (needColors) applyColors();
    if (needGap) applyGap();
  }

  // ========== Message handling (shared by PieSocket and preview mode) ==========
  function handleMessage(msg) {
    if (!msg || typeof msg !== 'object' || typeof msg.type !== 'string') return;
    const { type, data } = msg;
    if (type === 'FULL_STATE' || type === 'LYRICS_LOADED') gotState = true;
    switch (type) {
      case 'FULL_STATE':
        lyrics = data.lyrics || [];
        currentLineIndex = data.currentLineIndex;
        songTitle = data.songTitle || '';
        nextSongTitle = data.nextSongTitle || null;
        // v2 nests settings; v1 spread them at top level
        applySettings(data.settings || data, { render: false });
        renderLyrics();
        updateActiveLine();
        updateNowSinging();
        applyColors();
        applyGap();
        break;
      case 'LYRICS_LOADED':
        lyrics = data.lyrics || [];
        currentLineIndex = -1;
        songTitle = data.songTitle || '';
        nextSongTitle = data.nextSongTitle || null;
        renderLyrics();
        updateNowSinging();
        break;
      case 'NEXT_SONG':
        nextSongTitle = data.nextSongTitle || null;
        updateNowSinging();
        break;
      case 'SYNC_UPDATE':
        if (data.currentLineIndex !== currentLineIndex) {
          currentLineIndex = data.currentLineIndex;
          updateActiveLine();
        }
        break;
      case 'SETTINGS_PATCH':
        applySettings(data);
        break;
      // deprecated: protocol v1 per-field settings messages. Older app builds
      // still send these; drop this block in the next release.
      case 'FONT_SIZE':
      case 'LYRIC_COLORS':
      case 'TITLE_FONT_SIZE':
      case 'LYRICS_GAP':
      case 'VISIBLE_RANGE':
        applySettings(data);
        break;
      case 'OFFSET':
        // Offset is applied on control page side; OBS just needs fresh sync
        break;
    }
  }

  // ========== Preview mode (embedded in the control page via <iframe>) ==========
  // `?preview=1`: no PieSocket at all — the parent window feeds the same SyncMessages
  // through postMessage. Only same-origin messages from the parent are accepted.
  const params = new URLSearchParams(window.location.search);
  const previewMode = params.get('preview') === '1';

  if (previewMode && window.parent !== window) {
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent || event.origin !== window.location.origin) return;
      handleMessage(event.data);
    });
    window.parent.postMessage({ type: 'REQUEST_STATE', data: null }, window.location.origin);
  }

  // ========== PieSocket (OBS Sync) ==========
  const sessionId = params.get('s') || '';
  const channelName = sessionId ? `lyribox-${sessionId}` : 'lyribox';

  const piesocket = previewMode ? null : new PieSocket.default({
    clusterId: '__VITE_PIESOCKET_CLUSTER_ID__',
    apiKey: '__VITE_PIESOCKET_API_KEY__',
    notifySelf: 0,
  });

  function requestFullState() {
    if (syncChannel) {
      syncChannel.publish('sync', { type: 'REQUEST_STATE', data: null });
      console.log('Requesting full state on channel:', channelName);
    }
  }

  function connectChannel() {
    piesocket.subscribe(channelName).then(ch => {
      syncChannel = ch;

      ch.listen('sync', handleMessage);

      // Ask for the full state once on connect. The control page also pushes it
      // whenever it (re)connects, so no polling is needed while idle.
      requestFullState();
      scheduleInitialRetries();

      // piesocket-js reconnects dropped sockets itself but emits no 'open' event;
      // it re-reads channel.onOpen on every reconnect, so hook it to re-request state.
      const originalOnOpen = ch.onOpen.bind(ch);
      ch.onOpen = (event) => {
        originalOnOpen(event);
        console.log('Reconnected, re-requesting state');
        requestFullState();
        scheduleInitialRetries();
      };

      // If the server rejected the channel the library gives up; start over after a pause.
      ch.on('close', () => {
        if (ch.shouldReconnect) return;
        console.warn('Channel closed for good, resubscribing in 3s');
        syncChannel = null;
        piesocket.unsubscribe(channelName);
        setTimeout(connectChannel, 3000);
      });
    }).catch(err => {
      console.error('PieSocket subscribe failed:', err);
      setTimeout(connectChannel, 3000);
    });
  }

  if (!previewMode) connectChannel();

  function renderLyrics() {
    const container = document.getElementById('lyricsContainer');
    container.innerHTML = '';

    if (lyrics.length === 0) {
      container.innerHTML = '<div class="waiting">等待載入歌詞...</div>';
      return;
    }

    const e = effective();
    lyrics.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'lyric-line upcoming';
      div.id = `lyric-${index}`;
      div.style.fontSize = e.otherFontSize + 'px';
      div.style.color = otherColor;

      if (item.text === '' || item.text === '//') {
        div.classList.add('interlude');
        div.appendChild(document.createTextNode('\u9593\u594F'));
      } else {
        div.appendChild(document.createTextNode(item.text));
        if (item.subText) {
          const sub = document.createElement('div');
          sub.className = 'lyric-sub';
          sub.textContent = item.subText;
          div.appendChild(sub);
        }
      }

      container.appendChild(div);
    });
  }

  function updateActiveLine() {
    const lines = document.querySelectorAll('.lyric-line');
    const e = effective();
    const lo = currentLineIndex - e.visibleBefore;
    const hi = currentLineIndex + e.visibleAfter;
    lines.forEach((line, i) => {
      line.classList.remove('active', 'next', 'visible');
      if (i < lo || i > hi || currentLineIndex < 0) return;
      if (i === currentLineIndex) {
        line.classList.add('active', 'visible');
        line.style.fontSize = e.activeFontSize + 'px';
        line.style.color = activeColor;
      } else {
        line.classList.add('next', 'visible');
        line.style.fontSize = e.otherFontSize + 'px';
        line.style.color = i < currentLineIndex ? passedColor : otherColor;
      }
    });
  }
</script>

</body>
</html>
