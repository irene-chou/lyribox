<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyribox - OBS Display</title>
<script src="https://unpkg.com/piesocket-js@5.2.0/dist/piesocket.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>@import url("https://font.emtech.cc/css/GenSenRoundedTW");</style>
<style>
  :root {
    --accent: #7c6aef;
    --accent-glow: rgba(124, 106, 239, 0.3);
    --active-lyric: #ffffff;

    --passed-lyric: #5a5a70;
    --upcoming-lyric: #9090a8;
    --text-dim: #55556a;
    --text-secondary: #8888a0;
    --text-primary: #e8e8f0;
    --border: #2a2a3a;
    --font-main: 'Noto Sans TC', sans-serif;
    --font-lyrics: 'GenSenRoundedTW', 'Noto Sans TC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-main);
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .lyrics-scroll-container {
    width: 100vw;
    margin-top: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .lyrics-scroll-container::-webkit-scrollbar { width: 0; }

  .lyric-line {
    border-radius: 10px;
    font-family: var(--font-lyrics);
    font-size: 28px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text-dim);
    transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    display: none;
  }

  .lyric-line.visible {
    display: block;
  }

  .lyric-line.active {
    font-weight: 700;
  }

  .lyric-line.interlude {
    font-style: italic;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  /* Enhanced LRC word fill: dimmed base + clipped overlay in the active color */
  .lyric-word { position: relative; display: inline-block; white-space: pre; }
  .lyric-word-base { opacity: 0.6; }
  .lyric-word-fill { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); }

  .lyric-sub {
    font-size: 0.6em;
    font-weight: 400;
    line-height: 1.4;
    opacity: 0.75;
    margin-top: 2px;
    white-space: pre-line;
  }

  .now-singing {
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 16px;
    font-family: var(--font-lyrics);
  }
  .now-singing-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 13px;
    color: #ffffff;
  }
  .now-singing-title {
    font-weight: 500;
    font-size: 18px;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .waiting {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: var(--text-dim);
    font-size: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<div class="now-singing" id="nowSinging">
  <span class="now-singing-label">Now singing</span>
  <span class="now-singing-title" id="nowSingingTitle"></span>
</div>
<div class="lyrics-scroll-container" id="lyricsContainer">
  <div class="waiting" id="waitingState">等待控制頁面連線...</div>
</div>

<script>
  let lyrics = [];
  let currentLineIndex = -1;
  let activeFontSize = 32;
  let otherFontSize = 28;
  let titleFontSize = 18;
  let showTitle = true;
  let lyricsGap = 16;
  let visibleBefore = 0;
  let visibleAfter = 1;
  let activeColor = '#ffffff';
  let otherColor = '#9090a8';
  let passedColor = '#5a5a70';
  let lyricsBgColor = 'transparent';
  let songTitle = '';
  // Word-level timing: last offset-applied time from the control page and when it arrived
  let syncTime = null;
  let syncPerf = 0;
  let wordRaf = null;
  const MAX_EXTRAPOLATION_S = 0.3;
  let syncChannel = null;
  let gotState = false;
  // After a (re)connect, retry the state request a couple of times if nothing
  // has arrived (covers a dropped first message). Bounded — no polling while idle.
  const INITIAL_RETRY_DELAYS_MS = [5000, 20000];
  let retryTimers = [];
  function scheduleInitialRetries() {
    retryTimers.forEach(clearTimeout);
    gotState = false;
    retryTimers = INITIAL_RETRY_DELAYS_MS.map((ms) => setTimeout(() => {
      if (!gotState) requestFullState();
    }, ms));
  }

  function applyGap() {
    document.getElementById('lyricsContainer').style.gap = lyricsGap + 'px';
  }

  function applyColors() {
    document.body.style.background = lyricsBgColor === 'transparent' ? 'transparent' : lyricsBgColor;
  }

  function updateNowSinging() {
    const el = document.getElementById('nowSinging');
    const titleEl = document.getElementById('nowSingingTitle');
    const labelEl = document.querySelector('.now-singing-label');
    if (showTitle && songTitle && lyrics.length > 0) {
      titleEl.textContent = songTitle;
      labelEl.style.fontSize = Math.round(titleFontSize * 0.72) + 'px';
      titleEl.style.fontSize = titleFontSize + 'px';
      el.style.display = 'flex';
    } else {
      el.style.display = 'none';
    }
  }

  // ========== PieSocket (OBS Sync) ==========
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('s') || '';
  const channelName = sessionId ? `lyribox-${sessionId}` : 'lyribox';

  const piesocket = new PieSocket.default({
    clusterId: '__VITE_PIESOCKET_CLUSTER_ID__',
    apiKey: '__VITE_PIESOCKET_API_KEY__',
    notifySelf: 0,
  });

  function requestFullState() {
    if (syncChannel) {
      syncChannel.publish('sync', { type: 'REQUEST_STATE', data: null });
      console.log('Requesting full state on channel:', channelName);
    }
  }

  function connectChannel() {
    piesocket.subscribe(channelName).then(ch => {
      syncChannel = ch;

      ch.listen('sync', (msg) => {
        const { type, data } = msg;
        if (type === 'FULL_STATE' || type === 'LYRICS_LOADED') gotState = true;
        switch (type) {
          case 'FULL_STATE':
            lyrics = data.lyrics || [];
            currentLineIndex = data.currentLineIndex;
            activeFontSize = data.activeFontSize || 32;
            otherFontSize = data.otherFontSize || 28;
            titleFontSize = data.titleFontSize || 18;
            showTitle = data.showTitle ?? true;
            lyricsGap = data.lyricsGap ?? 16;
            visibleBefore = data.visibleBefore ?? 0;
            visibleAfter = data.visibleAfter ?? 1;
            activeColor = data.activeColor || '#ffffff';
            otherColor = data.otherColor || '#9090a8';
            passedColor = data.passedColor || '#5a5a70';
            lyricsBgColor = data.lyricsBgColor || 'transparent';
            songTitle = data.songTitle || '';
            syncTime = null;
            renderLyrics();
            updateActiveLine();
            updateNowSinging();
            applyColors();
            applyGap();
            break;
          case 'LYRICS_LOADED':
            lyrics = data.lyrics || [];
            currentLineIndex = -1;
            syncTime = null;
            songTitle = data.songTitle || '';
            renderLyrics();
            updateNowSinging();
            break;
          case 'SYNC_UPDATE':
            if (typeof data.currentTime === 'number') {
              syncTime = data.currentTime;
              syncPerf = performance.now();
            }
            if (data.currentLineIndex !== currentLineIndex) {
              currentLineIndex = data.currentLineIndex;
              updateActiveLine();
            }
            ensureWordLoop();
            break;
          case 'FONT_SIZE':
            activeFontSize = data.activeFontSize;
            otherFontSize = data.otherFontSize;
            updateActiveLine();
            break;
          case 'LYRIC_COLORS':
            activeColor = data.activeColor || '#ffffff';
            otherColor = data.otherColor || '#9090a8';
            passedColor = data.passedColor || '#5a5a70';
            lyricsBgColor = data.lyricsBgColor || 'transparent';
            updateActiveLine();
            applyColors();
            break;
          case 'TITLE_FONT_SIZE':
            titleFontSize = data.titleFontSize;
            showTitle = data.showTitle ?? true;
            updateNowSinging();
            break;
          case 'LYRICS_GAP':
            lyricsGap = data.lyricsGap ?? 16;
            applyGap();
            break;
          case 'VISIBLE_RANGE':
            visibleBefore = data.visibleBefore ?? 0;
            visibleAfter = data.visibleAfter ?? 1;
            updateActiveLine();
            break;
          case 'OFFSET':
            // Offset is applied on control page side; OBS just needs fresh sync
            break;
        }
      });

      // Ask for the full state once on connect. The control page also pushes it
      // whenever it (re)connects, so no polling is needed while idle.
      requestFullState();
      scheduleInitialRetries();

      // piesocket-js reconnects dropped sockets itself but emits no 'open' event;
      // it re-reads channel.onOpen on every reconnect, so hook it to re-request state.
      const originalOnOpen = ch.onOpen.bind(ch);
      ch.onOpen = (event) => {
        originalOnOpen(event);
        console.log('Reconnected, re-requesting state');
        requestFullState();
        scheduleInitialRetries();
      };

      // If the server rejected the channel the library gives up; start over after a pause.
      ch.on('close', () => {
        if (ch.shouldReconnect) return;
        console.warn('Channel closed for good, resubscribing in 3s');
        syncChannel = null;
        piesocket.unsubscribe(channelName);
        setTimeout(connectChannel, 3000);
      });
    }).catch(err => {
      console.error('PieSocket subscribe failed:', err);
      setTimeout(connectChannel, 3000);
    });
  }

  connectChannel();

  function renderLyrics() {
    const container = document.getElementById('lyricsContainer');
    container.innerHTML = '';

    if (lyrics.length === 0) {
      container.innerHTML = '<div class="waiting">等待載入歌詞...</div>';
      return;
    }

    lyrics.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'lyric-line upcoming';
      div.id = `lyric-${index}`;
      div.style.fontSize = otherFontSize + 'px';
      div.style.color = otherColor;

      if (item.text === '' || item.text === '//') {
        div.classList.add('interlude');
        div.appendChild(document.createTextNode('\u9593\u594F'));
      } else {
        const textEl = document.createElement('span');
        textEl.className = 'lyric-text';
        textEl.textContent = item.text;
        textEl.dataset.mode = 'plain';
        div.appendChild(textEl);
        if (item.subText) {
          const sub = document.createElement('div');
          sub.className = 'lyric-sub';
          sub.textContent = item.subText;
          div.appendChild(sub);
        }
      }

      container.appendChild(div);
    });
  }

  function hasWords(item) {
    return !!(item && item.words && item.words.length > 0);
  }

  // Active line with Enhanced LRC words → per-word spans; otherwise plain text.
  function setLineContent(lineEl, item, active) {
    const textEl = lineEl.querySelector('.lyric-text');
    if (!textEl) return;
    if (active && hasWords(item)) {
      if (textEl.dataset.mode !== 'words') {
        textEl.textContent = '';
        item.words.forEach((w) => {
          const word = document.createElement('span');
          word.className = 'lyric-word';
          const base = document.createElement('span');
          base.className = 'lyric-word-base';
          base.textContent = w.text;
          const fill = document.createElement('span');
          fill.className = 'lyric-word-fill';
          fill.setAttribute('aria-hidden', 'true');
          fill.textContent = w.text;
          word.appendChild(base);
          word.appendChild(fill);
          textEl.appendChild(word);
        });
        textEl.dataset.mode = 'words';
      }
      textEl.querySelectorAll('.lyric-word-base').forEach((el) => { el.style.color = otherColor; });
      textEl.querySelectorAll('.lyric-word-fill').forEach((el) => { el.style.color = activeColor; });
    } else if (textEl.dataset.mode !== 'plain') {
      textEl.textContent = item.text;
      textEl.dataset.mode = 'plain';
    }
  }

  function findActiveWordIndex(words, t) {
    let idx = -1;
    for (let i = 0; i < words.length; i++) {
      if (words[i].time <= t) idx = i; else break;
    }
    return idx;
  }

  function wordProgress(words, index, t, endTime) {
    const word = words[index];
    if (!word) return 0;
    const end = index + 1 < words.length ? words[index + 1].time : endTime;
    if (end === undefined || end <= word.time) return 1;
    const p = (t - word.time) / (end - word.time);
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }

  function ensureWordLoop() {
    if (wordRaf !== null) return;
    const item = lyrics[currentLineIndex];
    if (!hasWords(item) || syncTime === null) return;
    wordRaf = requestAnimationFrame(wordFrame);
  }

  function wordFrame() {
    wordRaf = null;
    const item = lyrics[currentLineIndex];
    if (!hasWords(item) || syncTime === null) return;
    const lineEl = document.getElementById(`lyric-${currentLineIndex}`);
    if (!lineEl) return;

    // Extrapolate between 80ms ticks; freeze if updates stop (paused / stalled)
    const extra = Math.min((performance.now() - syncPerf) / 1000, MAX_EXTRAPOLATION_S);
    const t = syncTime + extra;
    const endTime = item.endTime !== undefined ? item.endTime : (lyrics[currentLineIndex + 1] || {}).time;
    const idx = findActiveWordIndex(item.words, t);
    const progress = idx >= 0 ? wordProgress(item.words, idx, t, endTime) : 0;

    const fills = lineEl.querySelectorAll('.lyric-word-fill');
    fills.forEach((el, i) => {
      const clip = i < idx ? 0 : i > idx ? 100 : (1 - progress) * 100;
      const next = `inset(0 ${clip}% 0 0)`;
      if (el.style.clipPath !== next) el.style.clipPath = next;
    });

    wordRaf = requestAnimationFrame(wordFrame);
  }

  function updateActiveLine() {
    const lines = document.querySelectorAll('.lyric-line');
    const lo = currentLineIndex - visibleBefore;
    const hi = currentLineIndex + visibleAfter;
    lines.forEach((line, i) => {
      line.classList.remove('active', 'next', 'visible');
      const isActive = i === currentLineIndex;
      setLineContent(line, lyrics[i], isActive);
      if (i < lo || i > hi || currentLineIndex < 0) return;
      if (isActive) {
        line.classList.add('active', 'visible');
        line.style.fontSize = activeFontSize + 'px';
        line.style.color = activeColor;
      } else {
        line.classList.add('next', 'visible');
        line.style.fontSize = otherFontSize + 'px';
        line.style.color = i < currentLineIndex ? passedColor : otherColor;
      }
    });
  }
</script>

</body>
</html>
